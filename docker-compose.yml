# docker-compose.yml

services:
  # 1. PostgreSQL Database
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prismadmin
      POSTGRES_PASSWORD: prismpassword
      POSTGRES_DB: prismdb
    ports:
      - "5433:5432" # Host gets 5433 (pgAdmin), Internal network gets 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. MinIO Cloud Storage
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: prismadmin
      MINIO_ROOT_PASSWORD: prismpassword
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    volumes:
      - minio_data:/data

  # 3. Redis (Required message broker for Celery)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # 4. FastAPI Backend
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://prismadmin:prismpassword@postgres_db:5432/prismdb
      - MINIO_ENDPOINT_URL=http://minio:9000
      - MINIO_ACCESS_KEY=prismadmin
      - MINIO_SECRET_KEY=prismpassword
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app:/app/core_ml
    volumes:
      - ./backend:/app
      - ./core_ml:/app/core_ml
    depends_on:
      - postgres_db
      - minio
      - redis

  # 5. Celery Worker (For async ML training)
  celery_worker:
    build:
      context: ./backend
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://prismadmin:prismpassword@postgres_db:5432/prismdb
      - MINIO_ENDPOINT_URL=minio:9000
      - MINIO_ACCESS_KEY=prismadmin
      - MINIO_SECRET_KEY=prismpassword
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app:/app/core_ml
    depends_on:
      - backend
      - redis
    volumes:
      - ./backend:/app
      - ./core_ml:/app/core_ml

  # 6. React/Next.js Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app             # Creates the live code tunnel
      - /app/node_modules           # Protects the container's installed packages
      - /app/.next
# Persistent Volumes so data isn't wiped on restart
volumes:
  postgres_data:
  minio_data: